[package]
name = "lockalperen-desktop"
version = "0.3.0"
edition = "2021"
license = "MIT"
publish = false

# A workspace of its own: the Tauri/WebView dependency tree stays out of the
# core workspace (its CI, Cargo.lock and `cargo deny` policy).
[workspace]

[lib]
name = "lockalperen_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
lav-core = { path = "../../../crates/lav-core" }
# No "devtools" feature: the inspector exists only in debug builds.
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.4"
# A second start only brings the running window forward (src/tray.rs).
tauri-plugin-single-instance = "=2.5.5"
# Self-update (src/update.rs): minisign-verified NSIS installer from this
# repo's GitHub Releases. No "zip" feature (only for macOS/Linux bundles).
# system-proxy: company networks often allow the web only through a proxy.
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
zeroize = "1"
serde_json = "1"
uuid = "1"
base64 = "0.22"
# Site icons: fetched and re-encoded by our own sandboxed crate (opt-in).
lav-favicon = { path = "../../../crates/lav-favicon" }
# TOTP (src/totp.rs). hmac, sha2 and url are already in the tree; sha1 is
# the RustCrypto crate of the same family.
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
url = "2"
# KeePass import (src/import.rs). Parsing only; the file is pre-checked by us
# (version, size, KDF limits) before this crate sees it.
keepass = { version = "=0.17.0", default-features = false }
# Already in Tauri's tree at this version; used only by src/clipboard.rs
# src/autolock.rs and src/hardening.rs (the only unsafe code in the app).
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }


[dev-dependencies]
# examples/verify_release.rs (release workflow). Same version the updater
# plugin verifies with.
minisign-verify = "=0.3.0"
# Only to WRITE KDBX 4 fixtures in tests.
keepass = { version = "=0.17.0", default-features = false, features = ["save_kdbx4"] }
# keepass uses rust-argon2 (lib name `argon2`); only for KdfConfig in tests.
kp_argon2 = { package = "rust-argon2", version = "3" }

[profile.dev.package."*"]
# Argon2 is extremely slow without optimizations.
opt-level = 3

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
strip = true
panic = "abort"
