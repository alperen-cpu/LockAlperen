[package]
name = "lav-core"
description = "Core vault format and cryptography for LockAlperen"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
ciborium = "0.2"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
subtle = "2.6"
unicode-normalization = "0.1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
# VirtualLock / mlock for the key pages (safe API; this crate stays unsafe-free).
region = "4"
zeroize = { version = "1.8", features = ["derive"] }

[features]
# Raw crypto helpers for this crate's tests (bypass the commitment check).
test-utils = []

[dev-dependencies]
lav-core = { path = ".", features = ["test-utils"] }
