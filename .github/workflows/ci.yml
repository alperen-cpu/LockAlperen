name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch newly published advisories

# Least privilege for every job.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to full commit SHAs (supply-chain hardening).
# actions/checkout v4            = 11d5960a326750d5838078e36cf38b85af677262
# dtolnay/rust-toolchain stable  = b725eda525362e7cf34af9a7243cac1e3f01a7ec

jobs:
  test:
    # Linux added 2026-11: flock/unlink/fsync semantics and the core's tests
    # must be exercised on both platforms (the process memory scan in
    # lav-memtest is Windows-only and is compiled out on Linux).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all
      # Mutation fuzzing with more iterations than the default test run.
      - run: cargo test --locked --release -p lav-core --test fuzz_smoke -p lav-favicon --test fuzz_smoke
        env:
          LAV_FUZZ_ITERS: "200000"

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - run: cargo install cargo-audit --locked --version 0.23.0
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo audit --deny warnings --ignore RUSTSEC-2025-0057 # fxhash: unmaintained, no vuln
      - run: cargo deny --locked check

  fuzz:
    # Coverage-guided fuzzing (libFuzzer + ASan) needs Linux.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [header_parse, payload_decode, image_sanitize, icon_links, site_origin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=120 -rss_limit_mb=2048
        working-directory: fuzz
