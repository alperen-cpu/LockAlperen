name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch newly published advisories

# Least privilege for every job.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to full commit SHAs (supply-chain hardening).
# actions/checkout v4            = 11d5960a326750d5838078e36cf38b85af677262
# dtolnay/rust-toolchain stable  = b725eda525362e7cf34af9a7243cac1e3f01a7ec
# actions/upload-artifact v4.6.2 = ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:
  test:
    # Linux added 2026-11: flock/unlink/fsync semantics and the core's tests
    # must be exercised on both platforms (the process memory scan in
    # lav-memtest is Windows-only and is compiled out on Linux).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all
      # Mutation fuzzing with more iterations than the default test run.
      - run: cargo test --locked --release -p lav-core --test fuzz_smoke -p lav-favicon --test fuzz_smoke
        env:
          LAV_FUZZ_ITERS: "200000"

  desktop:
    # The Tauri app (apps/desktop) is its own Cargo workspace, built for both
    # platforms it ships on. Windows: the runner's MSVC toolchain is what a
    # release build uses. Linux: Ubuntu 22.04, the oldest supported release,
    # so that what is built here also runs on 24.04 (glibc, WebKitGTK 4.1).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy, rustfmt
      - name: Linux build dependencies (WebKitGTK, tray, AppImage tools)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential file patchelf
      - run: npm ci --no-audit --no-fund
      # Blocking: everything that ends up in the installed app. The audits
      # read lock files, which are the same on both platforms: run once.
      - run: npm audit --omit=dev --audit-level=low
        if: runner.os == 'Windows'
      # Build tools (Vite and its dependencies) never ship, and an advisory
      # can land before any fixed version exists (picomatch, GHSA-fc5q-39xc-vjpf,
      # 2026-11-18). Still run so it shows in the log, but do not block.
      - name: npm audit (build tools, warning only)
        if: runner.os == 'Windows'
        run: npm audit --audit-level=low
        continue-on-error: true
      - run: npm run build
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri
      # Linux: the .deb and the AppImage really bundle (unsigned here; the
      # release workflow signs). Catches missing libraries and bad config.
      - name: Bundle (Linux, unsigned)
        if: runner.os == 'Linux'
        run: npx tauri build --ci --bundles deb,appimage
      # For trying a branch on a real Ubuntu desktop before a release. These
      # are unsigned test builds: install releases from GitHub Releases.
      - name: Upload the Linux packages (test builds)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-packages-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
      - run: cargo install cargo-audit --locked --version 0.23.0
        if: runner.os == 'Windows'
      # Both are Linux-only (GTK) dependencies of Tauri, not in the Windows build:
      # RUSTSEC-2024-0370 proc-macro-error unmaintained; RUSTSEC-2024-0429 glib unsound.
      # RUSTSEC-2025-0057 fxhash unmaintained (via lav-favicon -> scraper), as in the core job.
      # RUSTSEC-2026-0370/0371/0372 zvariant, zbus_names, zvariant_derive unmaintained: D-Bus,
      # pulled in only on Linux by tauri-plugin-single-instance; not in the Windows build
      # (`cargo tree --target x86_64-pc-windows-msvc` has no zbus/zvariant).
      # RUSTSEC-2026-0543 chrono unmaintained, no known vulnerability: IN the Windows build,
      # via keepass (KDBX import, reads entry timestamps). Same policy as fxhash; revisit when
      # keepass drops or replaces chrono.
      # Cargo.lock lists every platform's dependencies, so this one run on
      # Windows also covers the Linux build (the ignores below are Linux ones).
      - if: runner.os == 'Windows'
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2025-0057 --ignore RUSTSEC-2026-0370 --ignore RUSTSEC-2026-0371 --ignore RUSTSEC-2026-0372 --ignore RUSTSEC-2026-0543
        working-directory: apps/desktop/src-tauri

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - run: cargo install cargo-audit --locked --version 0.23.0
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo audit --deny warnings --ignore RUSTSEC-2025-0057 # fxhash: unmaintained, no vuln
      - run: cargo deny --locked check

  fuzz:
    # Coverage-guided fuzzing (libFuzzer + ASan) needs Linux.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [header_parse, payload_decode, image_sanitize, icon_links, site_origin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=120 -rss_limit_mb=2048
        working-directory: fuzz
